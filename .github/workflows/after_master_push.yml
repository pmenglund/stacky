name: Act on main branch push

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  go_tests:
    name: Go unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run go test ./...
        run: go test ./...

  go_smoke:
    name: Targeted smoke tests
    needs: go_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run focused smoke suite
        run: ./tools/smoke.sh

  build_binaries:
    name: Cross-compile nightly artifacts
    needs: go_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }} binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: nightly
        run: |
          set -euo pipefail
          pkg="stacky_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p artifacts "${pkg}"
          echo "Building ${pkg}/stacky"
          go build -trimpath -ldflags "-s -w" -o "${pkg}/stacky" .
          cp LICENSE.txt "${pkg}/"
          if [ "${GOOS}" = "windows" ]; then
            mv "${pkg}/stacky" "${pkg}/stacky.exe"
            zip -r "artifacts/${pkg}.zip" "${pkg}"
          else
            tar -czf "artifacts/${pkg}.tar.gz" "${pkg}"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stacky-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          retention-days: 2
