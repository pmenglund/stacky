name: Act on release created

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions:
  contents: write

jobs:
  build_binaries:
    name: Cross-compile Go binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }} archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          pkg="stacky_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p artifacts "${pkg}"
          bin_name="stacky"
          if [ "${GOOS}" = "windows" ]; then
            bin_name="${bin_name}.exe"
          fi
          echo "Building ${pkg}/${bin_name}"
          go build -trimpath -ldflags "-s -w" -o "${pkg}/${bin_name}" .
          cp LICENSE.txt "${pkg}/"
          if [ -f README.md ]; then
            cp README.md "${pkg}/"
          fi
          if [ "${GOOS}" = "windows" ]; then
            zip -r "artifacts/${pkg}.zip" "${pkg}"
          else
            tar -czf "artifacts/${pkg}.tar.gz" "${pkg}"
          fi
          rm -rf "${pkg}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stacky-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*

  bundle_checksums:
    name: Generate checksums
    needs: build_binaries
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stacky-*
          path: artifacts
          merge-multiple: true
      - name: Create SHA256 sums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > "stacky_${VERSION}_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: stacky-checksums
          path: artifacts/stacky_${VERSION}_SHA256SUMS.txt

  github_release:
    name: Publish GitHub release with Go binaries
    needs:
      - build_binaries
      - bundle_checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stacky-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
