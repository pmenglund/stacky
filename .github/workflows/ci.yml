name: Continuous integration of Stacky

on:
  pull_request:
    branches:
      - master
      - main
    types: [opened, synchronize, edited, ready_for_review]
  push:
    branches:
      - master
      - main

jobs:
  go_tests:
    name: Go unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run go test ./...
        run: go test ./...

  go_smoke:
    name: Targeted smoke tests
    needs: go_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run focused smoke suite
        run: ./tools/smoke.sh

  bazel_targets:
    name: Bazel build + tests validate Go packaging
    needs: go_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install bazelisk
        run: |
          curl -L -o bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod a+x bazelisk
          ln -s bazelisk bazel
      - name: Bazel build
        run: ./bazel build //:stacky
      - name: Bazel test
        run: ./bazel test //:go_tests //:smoke_tests
